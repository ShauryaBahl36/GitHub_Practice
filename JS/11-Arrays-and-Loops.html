        // Arrays are references
        const array1 = [1,2,3];
        const array2 = array1.slice();
        array2.push(4);
        console.log(array1);
        console.log(array2);

        const [firstValue, secondValue] = [1,2,3];
        console.log(firstValue);
        console.log(secondValue);

        for (let i = 0; i <= 10; i++) {
            if (i === 3) {
                continue; // skip 1 iteration of the loop
            }
            console.log(i);
            if (i === 8) {
                break;
            }
        }

        let i = 1;

        while (i <= 10) {
            if (i % 3 === 0) {
                i++;
                continue;
            }
            console.log(i);
            i++;
        }

        function doubleArray(nums) {
            const numsDoubled = [];

            for (let i = 0; i < nums.length; i++) {
                if (nums[i] === 0) {
                    return numsDoubled; // early return
                }
                numsDoubled.push(nums[i] * 2);
            }
            return numsDoubled
        }
        console.log(doubleArray([1,4,6]));
        console.log(doubleArray([2,2,5]));
        console.log(doubleArray([2,2,5,4,0,6,7]));
